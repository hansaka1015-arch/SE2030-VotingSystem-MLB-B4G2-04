# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/votingsystem_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration (for caching and streaming)
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=5000ms

# Server Configuration
server.port=8080

# Voting Configuration
voting.free-vote-limit-per-episode=5
voting.grace-period-seconds=5

# Redis Stream Configuration for Vote Processing
vote.stream.name=votes:stream
vote.stream.group.name=vote-processors
vote.stream.consumer.prefix=vote-consumer
vote.stream.max-length=10000

# Async Configuration (fallback for other tasks)
task.executor.core-pool-size=10
task.executor.max-pool-size=20
task.executor.queue-capacity=5000