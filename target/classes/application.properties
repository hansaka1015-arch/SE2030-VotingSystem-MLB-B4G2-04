# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/votingsystem_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JDBC
spring.jdbc.initialize-schema=never

# Redis Configuration (for caching)
spring.redis.host=localhost
spring.redis.port=6379

# Server Configuration
server.port=8080

# Voting Configuration
voting.free-vote-limit-per-episode=5
voting.grace-period-seconds=5

# Async Configuration
task.executor.core-pool-size=10
task.executor.max-pool-size=20
task.executor.queue-capacity=5000